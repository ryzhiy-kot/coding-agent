[project]
name = "coding-agent"
version = "0.1.0"
description = "Financial analyst agent with code execution"
readme = "README.md"
authors = [
    { name = "Ryzhiy Kot", email = "kyatsenko@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.0.49",
    "google-cloud-aiplatform>=1.60.0",
    "google-cloud-bigquery>=3.25.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pyarrow>=17.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "plotly>=5.24.0",
    "duckdb>=1.1.0",
    "google-cloud-storage>=2.18.0",
    "pydantic-ai-slim[google]>=2.61.0",
]

[project.scripts]
coding-agent = "coding_agent:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
